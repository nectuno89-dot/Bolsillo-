<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121714">
<title>Bolsillo</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<style>
:root{
  --bg:#121714; --card:#1B221E; --raised:#232B27; --line:#2E3833;
  --text:#E9EDE8; --soft:#8A968F; --verde:#5FC08E; --rojo:#EE7351; --oro:#D2A44E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);min-height:100vh;
  font-family:'Instrument Sans',system-ui,-apple-system,sans-serif;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--verde);outline-offset:2px}
input{font:inherit;color:var(--text)}
input::placeholder{color:var(--soft)}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:'Newsreader',Georgia,serif;font-weight:200}
.wrap{max-width:520px;margin:0 auto;padding:0 20px 100px}
.press:active{transform:scale(.97);transition:transform .08s}
.hide{display:none!important}

.saldo{font-size:56px;line-height:1.02;margin-top:6px}
.lbl{font-size:13px;color:var(--soft)}
.barra{display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:18px;background:var(--line)}
.chip{padding:11px 16px;border-radius:999px;font-size:15px;border:1px solid var(--line);background:var(--card)}
.chip.on{background:var(--verde);color:#121714;border-color:var(--verde);font-weight:500}
.tarjeta{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}

nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--bg);
  border-top:1px solid var(--line);max-width:520px;margin:0 auto;
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:16px 0 20px;font-size:13px;color:var(--soft)}
nav button.on{color:var(--text);font-weight:600}

#pad{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
.teclas{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line)}
.teclas button{background:var(--bg);padding:22px 0;font-size:24px}
.principal{width:100%;padding:18px;border-radius:14px;font-size:16px;font-weight:600;
  background:var(--verde);color:#121714}
.principal:disabled{background:var(--line);color:var(--soft)}

.mov{width:100%;display:flex;align-items:center;gap:12px;padding:13px 0;
  border-bottom:1px solid var(--line);text-align:left}
.pin{width:3px;height:28px;border-radius:2px;flex-shrink:0}
</style>
</head>
<body>

<div id="app" class="wrap"></div>

<nav id="nav"></nav>

<!-- Pantalla de captura -->
<div id="pad" class="hide">
  <div style="display:flex;align-items:center;gap:14px;padding:20px">
    <button id="padVolver" style="font-size:22px;color:var(--soft)">&larr;</button>
    <span id="padTitulo" style="font-size:16px;font-weight:500"></span>
  </div>

  <div id="padMonto" style="flex:1;display:flex;align-items:center;justify-content:flex-end;padding:0 24px">
    <span id="padCifra" class="serif num" style="font-size:56px"></span>
  </div>

  <div id="padCats" class="hide" style="flex:1;overflow-y:auto;padding:0 20px">
    <div id="catsWrap" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    <input id="padNota" placeholder="Nota (opcional)" style="width:100%;margin-top:20px;
      padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:15px">
  </div>

  <div id="teclado" class="teclas"></div>
  <div style="padding:14px 16px 24px">
    <button id="padOk" class="principal press" disabled>Continuar</button>
  </div>
</div>

<script>
const CATS=["Comida","Transporte","Mercado","Salud","Hogar","Servicios","Ocio","Deudas","Otro"];
const CATS_IN=["Sueldo","Ventas","Préstamo","Reembolso","Otro"];
const KEY="bolsillo-v1";

let D={movimientos:[],saldoInicial:0};
try{const r=localStorage.getItem(KEY);if(r)D=JSON.parse(r);}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){}};

const fmt=n=>"$"+new Intl.NumberFormat("es-CO",{maximumFractionDigits:0}).format(Math.round(n||0));
const hoy=()=>new Date().toISOString();
const mesDe=s=>s.slice(0,7);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));

function dia(iso){
  const d=new Date(iso),h=new Date();
  const ig=(a,b)=>a.toDateString()===b.toDateString();
  if(ig(d,h))return"Hoy";
  if(ig(d,new Date(h-864e5)))return"Ayer";
  return d.toLocaleDateString("es-CO",{day:"numeric",month:"long"});
}

function calc(){
  const m=mesDe(hoy());let saldo=D.saldoInicial||0,entra=0,sale=0;
  for(const x of D.movimientos){
    saldo+=x.tipo==="ingreso"?x.monto:-x.monto;
    if(mesDe(x.fecha)===m){x.tipo==="ingreso"?entra+=x.monto:sale+=x.monto;}
  }
  return{saldo,entra,sale,mes:m};
}

function frecuentes(){
  const c={};
  for(const x of D.movimientos.slice(0,60)){
    if(x.tipo!=="gasto")continue;
    const k=x.categoria+"|"+x.monto;c[k]=(c[k]||0)+1;
  }
  return Object.entries(c).filter(([,n])=>n>=2).sort((a,b)=>b[1]-a[1]).slice(0,3)
    .map(([k])=>{const[categoria,monto]=k.split("|");return{categoria,monto:+monto};});
}

/* ── Captura ─────────────────────────────────────────── */
let B=null;
const pad=document.getElementById("pad");

function abrirPad(tipo){
  B={tipo,monto:0,paso:"monto",cat:null};
  pad.classList.remove("hide");
  document.getElementById("padTitulo").textContent=tipo==="gasto"?"Gasto":"Ingreso";
  document.getElementById("padMonto").classList.remove("hide");
  document.getElementById("padCats").classList.add("hide");
  document.getElementById("teclado").classList.remove("hide");
  document.getElementById("padNota").value="";
  document.getElementById("padOk").textContent="Continuar";
  pintarCifra();
}
function cerrarPad(){B=null;pad.classList.add("hide");render();}

function pintarCifra(){
  const c=document.getElementById("padCifra");
  c.textContent=fmt(B.monto);
  c.style.color=B.monto?(B.tipo==="gasto"?"var(--rojo)":"var(--verde)"):"var(--line)";
  document.getElementById("padOk").disabled=!B.monto;
}

document.getElementById("teclado").innerHTML=
  [1,2,3,4,5,6,7,8,9,"000",0,"del"].map(t=>
    `<button class="num press" data-t="${t}">${t==="del"?"⌫":t}</button>`).join("");

document.getElementById("teclado").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b||!B)return;
  const t=b.dataset.t;
  if(t==="del")B.monto=Math.floor(B.monto/10);
  else if(t==="000")B.monto=B.monto*1000;
  else if(B.monto<=99999999)B.monto=B.monto*10+ +t;
  pintarCifra();
});

document.getElementById("padVolver").addEventListener("click",()=>{
  if(B&&B.paso==="cat"){
    B.paso="monto";
    document.getElementById("padMonto").classList.remove("hide");
    document.getElementById("padCats").classList.add("hide");
    document.getElementById("teclado").classList.remove("hide");
    document.getElementById("padOk").textContent="Continuar";
    pintarCifra();
  } else cerrarPad();
});

document.getElementById("padOk").addEventListener("click",()=>{
  if(!B)return;
  if(B.paso==="monto"){
    B.paso="cat";
    document.getElementById("padMonto").classList.add("hide");
    document.getElementById("teclado").classList.add("hide");
    document.getElementById("padCats").classList.remove("hide");
    document.getElementById("padTitulo").textContent=fmt(B.monto);
    document.getElementById("padOk").textContent="Guardar";
    document.getElementById("padOk").disabled=true;
    const lista=B.tipo==="gasto"?CATS:CATS_IN;
    document.getElementById("catsWrap").innerHTML=
      lista.map(c=>`<button class="chip press" data-c="${esc(c)}">${esc(c)}</button>`).join("");
    return;
  }
  D.movimientos.unshift({
    id:uid(),tipo:B.tipo,monto:B.monto,categoria:B.cat,
    nota:document.getElementById("padNota").value.trim(),fecha:hoy()
  });
  save();cerrarPad();
});

document.getElementById("catsWrap").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  document.querySelectorAll("#catsWrap .chip").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");B.cat=b.dataset.c;
  document.getElementById("padOk").disabled=false;
});

/* ── Pantallas ───────────────────────────────────────── */
let vista="inicio",abierto=null;

function listaHTML(movs){
  let out="",ultimo=null;
  for(const m of movs){
    const d=dia(m.fecha);
    if(d!==ultimo){out+=`<div style="font-size:12px;color:var(--soft);margin:18px 0 6px">${d}</div>`;ultimo=d;}
    const ing=m.tipo==="ingreso";
    out+=`<button class="mov" data-id="${m.id}">
      <span class="pin" style="background:${ing?"var(--verde)":"var(--rojo)"}"></span>
      <span style="flex:1;min-width:0">
        <span style="font-size:15px;display:block">${esc(m.categoria)}</span>
        ${m.nota?`<span style="font-size:12px;color:var(--soft)">${esc(m.nota)}</span>`:""}
      </span>
      <span class="num" style="font-size:15px;color:${ing?"var(--verde)":"var(--text)"}">
        ${ing?"+":"−"}${fmt(m.monto).slice(1)}</span>
    </button>`;
    if(abierto===m.id)out+=`<div style="padding:10px 0 14px">
      <button class="borrar" data-id="${m.id}" style="padding:9px 15px;border-radius:9px;
        border:1px solid var(--line);font-size:13px;color:var(--rojo)">Eliminar</button></div>`;
  }
  return out;
}

function render(){
  const c=calc(),app=document.getElementById("app");

  if(vista==="inicio"){
    const f=frecuentes();
    const pe=(c.entra+c.sale)?(c.entra/(c.entra+c.sale))*100:50;
    app.innerHTML=`
      <div style="padding-top:30px">
        <div class="lbl">En bolsillo</div>
        <div class="serif num saldo" style="color:${c.saldo<0?"var(--rojo)":"var(--text)"}">${fmt(c.saldo)}</div>
        <div class="barra"><div style="width:${pe}%;background:var(--verde)"></div>
          <div style="flex:1;background:var(--rojo)"></div></div>
        <div style="display:flex;gap:16px;margin-top:10px;font-size:13px;color:var(--soft)">
          <span>Entró <span class="num" style="color:var(--verde)">${fmt(c.entra)}</span></span>
          <span>Salió <span class="num" style="color:var(--rojo)">${fmt(c.sale)}</span></span>
        </div>

        <div style="display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-top:22px">
          <button id="bGasto" class="press" style="padding:20px 16px;border-radius:14px;
            background:var(--rojo);color:#161A18;font-size:16px;font-weight:600;text-align:left">Registrar gasto</button>
          <button id="bIngreso" class="press" style="padding:20px 14px;border-radius:14px;
            background:var(--card);border:1px solid var(--line);border-left:3px solid var(--verde);
            font-size:15px;text-align:left">Ingreso</button>
        </div>

        ${f.length?`<div style="margin-top:16px">
          <div style="font-size:12px;color:var(--soft);margin-bottom:9px">De un toque</div>
          <div style="display:flex;flex-wrap:wrap;gap:8px">${f.map(x=>
            `<button class="rep press chip" data-c="${esc(x.categoria)}" data-m="${x.monto}">
              ${esc(x.categoria)} <span class="num" style="color:var(--soft)">${fmt(x.monto)}</span></button>`).join("")}
          </div></div>`:""}

        <button id="bAjuste" style="margin-top:18px;font-size:13px;color:var(--soft);text-decoration:underline">
          Ajustar el saldo</button>
        <div id="ajuste" class="hide" style="display:flex;gap:8px;margin-top:10px">
          <input id="ajusteVal" inputmode="numeric" placeholder="Lo que tienes ahora"
            style="flex:1;padding:12px 14px;border-radius:10px;border:1px solid var(--line);
            background:var(--card);font-size:16px">
          <button id="bFijar" style="padding:12px 18px;border-radius:10px;background:var(--verde);
            color:#121714;font-size:15px;font-weight:500">Fijar</button>
        </div>

        <div style="margin-top:26px">${
          D.movimientos.length?listaHTML(D.movimientos.slice(0,8)):
          `<p style="color:var(--soft);font-size:14px;line-height:1.6">
            Empieza fijando cuánto tienes ahora. Cada gasto que registres se va restando de ahí.</p>`
        }</div>
      </div>`;

    document.getElementById("bGasto").onclick=()=>abrirPad("gasto");
    document.getElementById("bIngreso").onclick=()=>abrirPad("ingreso");
    document.getElementById("bAjuste").onclick=()=>document.getElementById("ajuste").classList.toggle("hide");
    document.getElementById("bFijar").onclick=()=>{
      const n=parseInt(document.getElementById("ajusteVal").value.replace(/\D/g,"")||"0",10);
      if(n){D.saldoInicial+=n-calc().saldo;save();render();}
    };
    document.querySelectorAll(".rep").forEach(b=>b.onclick=()=>{
      D.movimientos.unshift({id:uid(),tipo:"gasto",monto:+b.dataset.m,
        categoria:b.dataset.c,nota:"",fecha:hoy()});
      save();render();
    });
  }

  if(vista==="movimientos"){
    app.innerHTML=`<div style="padding-top:30px">
      <h2 style="font-size:22px;font-weight:500">Movimientos</h2>
      ${D.movimientos.length?listaHTML(D.movimientos):
        `<p style="color:var(--soft);font-size:14px;margin-top:16px">Nada por aquí todavía.</p>`}
    </div>`;
  }

  if(vista==="mes"){
    const porCat={};
    for(const m of D.movimientos)
      if(m.tipo==="gasto"&&mesDe(m.fecha)===c.mes)
        porCat[m.categoria]=(porCat[m.categoria]||0)+m.monto;
    const filas=Object.entries(porCat).sort((a,b)=>b[1]-a[1]);
    const max=filas.length?filas[0][1]:1;
    const prom=c.sale/new Date().getDate();
    app.innerHTML=`<div style="padding-top:30px">
      <h2 style="font-size:22px;font-weight:500;text-transform:capitalize">
        ${new Date().toLocaleDateString("es-CO",{month:"long",year:"numeric"})}</h2>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px">
        <div class="tarjeta"><div style="font-size:12px;color:var(--soft)">Gastos</div>
          <div class="num" style="font-size:22px;margin-top:6px;color:var(--rojo)">${fmt(c.sale)}</div></div>
        <div class="tarjeta"><div style="font-size:12px;color:var(--soft)">Ingresos</div>
          <div class="num" style="font-size:22px;margin-top:6px;color:var(--verde)">${fmt(c.entra)}</div></div>
      </div>
      <div class="tarjeta" style="margin-top:10px"><div style="font-size:12px;color:var(--soft)">Promedio por día</div>
        <div class="num" style="font-size:22px;margin-top:6px;color:var(--oro)">${fmt(prom)}</div></div>
      <div style="margin-top:28px">${filas.length?filas.map(([k,v])=>`
        <div style="margin-bottom:16px">
          <div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:7px">
            <span>${esc(k)}</span><span class="num" style="color:var(--soft)">${fmt(v)}</span></div>
          <div style="height:5px;border-radius:3px;background:var(--line)">
            <div style="width:${(v/max)*100}%;height:100%;border-radius:3px;background:var(--rojo)"></div></div>
        </div>`).join(""):`<p style="color:var(--soft);font-size:14px">Sin gastos este mes todavía.</p>`}
      </div></div>`;
  }

  document.getElementById("nav").innerHTML=
    [["inicio","Bolsillo"],["movimientos","Movimientos"],["mes","Mes"]]
    .map(([k,l])=>`<button data-v="${k}" class="${vista===k?"on":""}">${l}</button>`).join("");
}

document.getElementById("nav").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  vista=b.dataset.v;abierto=null;render();
});

document.getElementById("app").addEventListener("click",e=>{
  const del=e.target.closest(".borrar");
  if(del){D.movimientos=D.movimientos.filter(m=>m.id!==del.dataset.id);
    abierto=null;save();render();return;}
  const mov=e.target.closest(".mov");
  if(mov){abierto=abierto===mov.dataset.id?null:mov.dataset.id;render();}
});

/* Atajo: mantener presionado el ícono → Registrar gasto */
if(new URLSearchParams(location.search).get("a")==="gasto"){
  render();abrirPad("gasto");
}else render();

if("serviceWorker" in navigator)
  navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
  </html>
